<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Items</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="items-container">
  <header class="site-header">
    <img src="/images/logo.png" alt="ElectroHub Logo" class="site-logo">
  </header>

  <h2>📦 Available Items</h2>


  <div class="auth-buttons">
    <a href="/eshop/admin/dashboard">
      <button class="admin-only-button">Admins Dashboard</button>
    </a>
    <a href="/orders.html" class="orders-icon" title="See your orders">🛒</a>
    <a href="/login" id="login-link"><button>Login</button></a>
    <button onclick="location.href='register'" id="register-link">Register</button>
  </div>


  <input
          type="text"
          id="searchInput"
          placeholder="Search products by name"
          style="margin-bottom: 15px; padding: 8px; width: 30%; font-size: 1rem;"
  >

  <div class="shop-container">

  <div class="filters">
    <div class="filter-group">
      <h1 style="display: inline; margin-right: 10px;">Filters</h1>
      <span id="clearFiltersLink" style="cursor: pointer; color: #007bff; display: inline;">Clear</span>
    </div>
    <div class="filter-group">
      <h3>Categories</h3>
      <div id="categoryToggles" style="margin-bottom: 15px;"></div>
    </div>
    <div class="filter-group">
      <div>
        <label for="sortSelect"><strong>Sort by:</strong></label>
      </div>
      <div>
        <select id="sortSelect">
          <option value="default">-- Select --</option>
          <option value="price-asc">Price ↑</option>
          <option value="price-desc">Price ↓</option>
        </select>
      </div>
    </div>

    <div class="filter-group">
      <div>
        <label for="minPrice"><strong>Price range:</strong></label>
      </div>
      <div>
        <input type="number" id="minPrice" placeholder="Min €">
        <span>-</span>
        <input type="number" id="maxPrice" placeholder="Max €">
        <button onclick="applyFilters()">Apply</button>
      </div>
    </div>
  </div>

  <div id="itemsGrid" class="items-grid"></div>
  </div>



</div>


<form action="/logout" method="post">
  <button type="submit">Disconnect</button>
</form>

<script src="js/items.js"></script>
</body>
</html>
